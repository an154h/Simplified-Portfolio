<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="portfolio-page">
      <aside class="left-column">
        <div class="profile-card">
          <img src="profile.jpeg" alt="Profile" class="profile-img" />
          <p class="bio">
            I build clean, responsive websites using HTML and CSS. Currently learning JavaScript and improving my front-end skills.
          </p>
          <div class="socials">
            <a href="https://github.com/an154h">GitHub</a>
            <a href="https://www.linkedin.com/in/anisah-suhailah-binti-iskandar-40a204244/">LinkedIn</a>
            <a href="mailto:anisah.work@outlook.com">Email</a>
          </div>
          <a href="#" class="resume-btn">Download Resume</a>
        </div>

        <section class="skills-card">
          <h2>Skills</h2>
          <div class="skill-row">
            <span>HTML</span>
            <div class="bar"><div class="fill html"></div></div>
          </div>
          <div class="skill-row">
            <span>CSS</span>
            <div class="bar"><div class="fill css"></div></div>
          </div>
          <div class="skill-row">
            <span>Responsive Design</span>
            <div class="bar"><div class="fill responsive"></div></div>
          </div>
          <div class="skill-row">
            <span>JavaScript</span>
            <div class="bar"><div class="fill js"></div></div>
          </div>
        </section>
      </aside>

      <main class="right-column">
        <h1 class="page-title">Projects</h1>

        <section class="showcase-panel" aria-label="Project showcase">
          <div class="showcase-header">
            <span class="showcase-name">Website</span>
          </div>

          <div class="carousel-wrap">
            <button class="carousel-arrow prev" type="button" aria-label="Previous project">
              &#8249;
            </button>

            <div class="carousel viewport">
              <div class="carousel-track">
                <article class="slide">
                  <div class="project-iframe-frame">
                    <iframe
                      src="https://spotify-playlist-seven.vercel.app/"
                      title="Spotify Playlist Preview"
                      loading="lazy"
                      allowfullscreen
                    ></iframe>
                  </div>
                </article>

                <article class="slide">
                  <div class="project-iframe-frame">
                    <iframe
                      src="https://all-posts.vercel.app/"
                      title="All Posts Preview"
                      loading="lazy"
                      allowfullscreen
                    ></iframe>
                  </div>
                </article>

                <article class="slide">
                  <div class="project-iframe-frame">
                    <iframe
                      src="https://anisahsuhailah37.wixsite.com/bwn-martial-arts"
                      title="Wix Website Preview"
                      loading="lazy"
                      allowfullscreen
                    ></iframe>
                  </div>
                </article>
              </div>
            </div>

            <button class="carousel-arrow next" type="button" aria-label="Next project">
              &#8250;
            </button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
